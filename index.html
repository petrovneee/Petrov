<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Final Stage</title>
  <style>
    body {
      background: #000;
      color: #00ff88;
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      width: 360px;
      border: 2px solid #00ff88;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 20px #00ff88;
    }
    .hold {
      margin-top: 20px;
      padding: 20px;
      border: 1px dashed #00ff88;
      user-select: none;
    }
    input {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background: #000;
      border: 1px solid #00ff88;
      color: #00ff88;
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background: #00ff88;
      border: none;
      cursor: pointer;
    }
    .hidden { display: none; }
    .out { margin-top: 15px; color: yellow; word-break: break-all; }
  </style>
</head>
<body><div class="box">
  <p>Kamu sudah sampai di akhir.</p>
  <p>Tidak semua hal terlihat jelas.</p>
  <p>Beberapa perlu diubah… sedikit saja.</p>  <div class="hold" id="hold">( tekan & tahan di sini )</div>  <div id="stage1" class="out hidden"></div>
  <div id="stage2" class="out hidden"></div>
  <div id="stage3" class="out hidden"></div>  <input id="answer" placeholder="Masukkan jawaban akhir..." />
  <button onclick="check()">SUBMIT</button>  <div id="result" class="out hidden"></div>
</div><script>
  let timer;
  const hold = document.getElementById('hold');

  hold.addEventListener('touchstart', start);
  hold.addEventListener('mousedown', start);
  hold.addEventListener('touchend', cancel);
  hold.addEventListener('mouseup', cancel);

  function start() {
    timer = setTimeout(() => {
      // STEP 1: Caesar +1 text
      document.getElementById('stage1').classList.remove('hidden');
      document.getElementById('stage1').innerHTML = 'Uifsf jt b tfdsfu';

      // STEP 2: hint
      setTimeout(() => {
        document.getElementById('stage2').classList.remove('hidden');
        document.getElementById('stage2').innerHTML = 'Look at every second letter.';
      }, 1500);

      // STEP 3: hint lanjutan
      setTimeout(() => {
        document.getElementById('stage3').classList.remove('hidden');
        document.getElementById('stage3').innerHTML = 'Not everything is in the right order. Reverse it. Then shift back.';
      }, 3000);

    }, 2000);
  }

  function cancel() {
    clearTimeout(timer);
  }

  function check() {
    const val = document.getElementById('answer').value.toLowerCase();
    const result = document.getElementById('result');

    // jawaban hasil puzzle (sudah ditentukan biar fair)
    if (val === 'treairh') {
      result.classList.remove('hidden');
      result.innerHTML = '🎉 BENAR!<br><br>Kode kamu (Morse):<br><br><b>-.. ..- -. / ..... ----- -.- / ---.. ---.. ..--- .----</b><br><br>Decode untuk klaim hadiah!';
    } else {
      result.classList.remove('hidden');
      result.innerHTML = '❌ Salah, coba lagi.';
    }
  }
</script></body>
</html>
